<div class="h-screen w-full flex flex-col bg-gray-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 overflow-hidden relative transition-colors duration-300">   
  <!-- Al hacer clic en el botón de menú, invierte el valor de isSidebarOpen -->
  <app-header (toggleSidebar)="isSidebarOpen = !isSidebarOpen"></app-header>
  
  <!-- Contenedor flex para el Sidebar y el Contenido -->
  <div class="flex flex-1 overflow-hidden relative">
    
    <!-- El Sidebar -->
    <!-- Recibe el estado y avisa si se cierra desde el overlay oscuro -->
    <app-sidebar 
      [isOpen]="isSidebarOpen" 
      (closeSidebar)="isSidebarOpen = false">
    </app-sidebar>
    
    <!-- Contenido Principal de tu App -->
    <main class="flex-1 overflow-y-auto p-6 md:p-8 bg-gray-50 dark:bg-slate-950 transition-colors duration-300">
      
      <router-outlet>
      </router-outlet>

    </main>

  </div>
</div>
