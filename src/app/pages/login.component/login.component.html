<div class="login-container">
  <div class="login-card">
    
    <!-- Branding / Logo Header -->
    <div class="brand-header">
      <div class="brand-logo">
        <img src="images/Logo.png" alt="Logo Infinito Viajes" class="logo-img">
      </div>
      <!-- <h1 class="brand-title">Infinito Viajes</h1> -->
      <p class="brand-subtitle">Gestión Integral de Operaciones</p>
    </div>

    <!-- Mensaje de Error General -->
    <div *ngIf="errorMessage()" class="alert alert-danger" role="alert">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ errorMessage() }}</span>
    </div>

    <!-- Formulario -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form" novalidate>
      
      <!-- Campo mail -->
      <div class="form-group">
        <label for="mail">Correo Electrónico</label>
        <div class="input-wrapper" [class.is-invalid]="loginForm.get('mail')?.invalid && loginForm.get('mail')?.touched">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </span>
          <input 
            id="mail" 
            type="email" 
            formControlName="mail" 
            placeholder="usuario@infinitoviajes.com"
            autocomplete="mail" />
        </div>
        <div *ngIf="loginForm.get('mail')?.invalid && loginForm.get('mail')?.touched" class="error-text">
          <span *ngIf="loginForm.get('mail')?.errors?.['required']">El correo es requerido.</span>
          <span *ngIf="loginForm.get('mail')?.errors?.['mail']">Ingrese un formato de correo válido.</span>
        </div>
      </div>

      <!-- Campo Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper" [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input 
            id="password" 
            [type]="showPassword() ? 'text' : 'password'" 
            formControlName="password" 
            placeholder="••••••••"
            autocomplete="current-password" />
          
          <button 
            type="button" 
            class="toggle-password" 
            (click)="togglePasswordVisibility()" 
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <svg *ngIf="!showPassword()" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="showPassword()" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-text">
          <span *ngIf="loginForm.get('password')?.errors?.['required']">La contraseña es requerida.</span>
        </div>
      </div>

      <!-- Botón de Ingreso -->
      <button 
        type="submit" 
        class="btn-submit" 
        [disabled]="isLoading() || loginForm.invalid">
        <span *ngIf="!isLoading()">Ingresar al Sistema</span>
        <span *ngIf="isLoading()" class="spinner-container">
          <span class="spinner"></span> Procesando...
        </span>
      </button>

    </form>

    <!-- Footer Card -->
    <div class="card-footer">
      <p>© Infinito Viajes — Sistema de Gestión</p>
    </div>

  </div>
</div>
