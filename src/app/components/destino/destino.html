<h2>Destinos</h2>
<button
  class="btn-primario"
  (click)="mostrarFormulario = true">
  Crear destino
</button>

@if (mostrarFormulario) {
  <app-destino-formulario
    [destinoEditar]="destinoEditando"
    (guardar)="guardarDestino($event)"
    (cerrar)="mostrarFormulario = false">
  </app-destino-formulario>
}

<hr>

<button class="btn-primario"(click)="obtenerDestinos()">Mostrar lista de destinos</button>

@for (destino of destinos; track destino.id) {
  <div>
    <h2 style="font-size: larger;">{{ destino.nombre }}</h2>
    <p>Ciudad: {{ destino.ciudad }}</p>
    <p>País: {{ destino.idPais }}</p>
    <p>Descripcion: {{ destino.descripcion }}</p>
    <button class="btn-borrar"(click)="eliminarDestino(destino.id)">Eliminar</button>
    <button class="btn-primario"(click)="editarDestino(destino)">Editar</button>
    <hr>
    <br>
  </div>
}
