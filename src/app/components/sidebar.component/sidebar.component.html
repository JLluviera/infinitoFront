<!-- Overlay oscuro para móviles -->
@if (isOpen) {
<div class="absolute inset-0 bg-slate-900/20 dark:bg-slate-900/60 z-40 md:hidden backdrop-blur-sm" (click)="onClose()">
</div>
}

<!-- Contenedor principal del Sidebar -->
<aside
  class="absolute inset-y-0 left-0 w-64 bg-white dark:bg-slate-900 border-r border-gray-100 dark:border-slate-800 shadow-sm z-50 transform transition-transform duration-300 md:relative md:h-full md:translate-x-0 flex flex-col shrink-0"
  [class.-translate-x-full]="!isOpen" [class.translate-x-0]="isOpen">
  <!-- Contenedor de los enlaces -->
  <nav class="flex-1 overflow-y-auto p-4 flex flex-col gap-1">

    <!-- ÍTEM BASE PARA COPIAR Y PEGAR -->
    <a href="#"
      class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-300 rounded-xl hover:bg-sky-50 dark:hover:bg-slate-800 hover:text-sky-700 dark:hover:text-sky-400 transition-all group font-medium cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg"
        class="w-5 h-5 text-slate-400 dark:text-slate-500 group-hover:text-sky-500 dark:group-hover:text-sky-400 transition-colors"
        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span>Inicio</span>
    </a>

    <!-- ÍTEM: Excursiones -->
    <a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-300 rounded-xl hover:bg-sky-50 dark:hover:bg-slate-800 hover:text-sky-700 dark:hover:text-sky-400 transition-all group font-medium cursor-pointer"
      routerLink="/excursiones" routerLinkActive="active" (click)="onClose()">
      <svg xmlns="http://www.w3.org/2000/svg"
        class="w-5 h-5 text-slate-400 dark:text-slate-500 group-hover:text-sky-500 dark:group-hover:text-sky-400 transition-colors"
        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>Excursiones</span>
    </a>

    <a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-300 rounded-xl hover:bg-sky-50 dark:hover:bg-slate-800 hover:text-sky-700 dark:hover:text-sky-400 transition-all group font-medium cursor-pointer"
      routerLink="/destinos" routerLinkActive="active" (click)="onClose()">
      <svg xmlns="http://www.w3.org/2000/svg"
        class="w-5 h-5 text-slate-400 dark:text-slate-500 group-hover:text-sky-500 dark:group-hover:text-sky-400 transition-colors"
        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
      </svg>
      <span>Destinos</span>
    </a>

    <!-- ÍTEM: Viajes -->
    <a href="#"
      class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-300 rounded-xl hover:bg-sky-50 dark:hover:bg-slate-800 hover:text-sky-700 dark:hover:text-sky-400 transition-all group font-medium cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg"
        class="w-5 h-5 text-slate-400 dark:text-slate-500 group-hover:text-sky-500 dark:group-hover:text-sky-400 transition-colors"
        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" />
      </svg>
      <span>Viajes</span>
    </a>

    <a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-300 rounded-xl hover:bg-sky-50 dark:hover:bg-slate-800 hover:text-sky-700 dark:hover:text-sky-400 transition-all group font-medium cursor-pointer"
      routerLink="/paises" routerLinkActive="active" (click)="onClose()">
      <svg xmlns="http://www.w3.org/2000/svg"
        class="w-5 h-5 text-slate-400 dark:text-slate-500 group-hover:text-sky-500 dark:group-hover:text-sky-400 transition-colors"
        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 100-18 9 9 0 000 18z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.6 9h16.8M3.6 15h16.8" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M11.5 3a17 17 0 000 18M12.5 3a17 17 0 010 18" />
      </svg>
      <span>Países</span>
    </a>

  </nav>

  <!-- Switch de Modo Oscuro -->
  <div class="p-4 mt-auto border-t border-gray-100 dark:border-slate-800">
    <button
      class="w-full flex items-center justify-between px-4 py-3 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl transition-all cursor-pointer group"
      (click)="toggleDarkMode()">

      <div class="flex items-center gap-3 font-medium">
        <svg xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5 text-slate-400 dark:text-slate-500 group-hover:text-slate-600 dark:group-hover:text-slate-200 transition-colors"
          fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
        <span>Oscuro</span>
      </div>

      <div class="w-10 h-5 rounded-full relative flex items-center transition-colors" [class.bg-sky-500]="isDarkMode"
        [class.bg-slate-200]="!isDarkMode">
        <div class="w-4 h-4 bg-white rounded-full absolute left-0.5 shadow-sm transition-transform duration-300"
          [class.translate-x-5]="isDarkMode"></div>
      </div>

    </button>
  </div>
</aside>
