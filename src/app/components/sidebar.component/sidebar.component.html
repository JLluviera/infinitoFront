<!-- Overlay oscuro para móviles (se muestra solo si isOpen es true) -->
@if (isOpen) {
  <div class="absolute inset-0 bg-black/20 z-40 md:hidden backdrop-blur-sm" (click)="onClose()"></div>
}

<!-- Contenedor principal del Sidebar -->
<!-- En móviles: se desliza desde la izquierda. En PC (md): siempre visible y estático -->
<aside 
  class="absolute inset-y-0 left-0 w-64 bg-white border-r-2 border-blue-100 shadow-md z-50 transform transition-transform duration-300 md:relative md:h-full md:translate-x-0 flex flex-col shrink-0"
  [class.-translate-x-full]="!isOpen"
  [class.translate-x-0]="isOpen"
>
  <!-- Contenedor de los enlaces con scroll por si hay muchos ítems -->
  <nav class="flex-1 overflow-y-auto p-4 flex flex-col gap-2">
    
    <!-- ========================================== -->
    <!-- INICIO DEL CONTENEDOR PARA COPIAR Y PEGAR  -->
    <!-- ========================================== -->
    <a href="#" class="flex items-center gap-4 px-4 py-3 text-gray-700 rounded-xl hover:bg-blue-50 hover:text-orange-500 transition-all group font-medium border border-transparent hover:border-blue-100 cursor-pointer">
      <!-- Ícono base azul, al hacer hover pasa a naranja -->
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-blue-600 group-hover:text-orange-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span>Inicio</span>
    </a>
    <!-- ========================================== -->
    <!-- FIN DEL CONTENEDOR PARA COPIAR Y PEGAR     -->
    <!-- ========================================== -->

    <!-- ÍTEM: Excursiones -->
    <a href="#" class="flex items-center gap-4 px-4 py-3 text-gray-700 rounded-xl hover:bg-blue-50 hover:text-orange-500 transition-all group font-medium border border-transparent hover:border-blue-100 cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-blue-600 group-hover:text-orange-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>Excursiones</span>
    </a>

    <!-- ÍTEM: Viajes -->
    <a href="#" class="flex items-center gap-4 px-4 py-3 text-gray-700 rounded-xl hover:bg-blue-50 hover:text-orange-500 transition-all group font-medium border border-transparent hover:border-blue-100 cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-blue-600 group-hover:text-orange-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" />
      </svg>
      <span>Viajes</span>
    </a>

  </nav>

  <!-- Decoración en la parte inferior (Opcional) -->
  <div class="p-4 mt-auto border-t-2 border-orange-100">
    <div class="bg-blue-50 rounded-lg p-3 text-sm text-blue-800 flex items-start gap-2">
      <span class="w-2 h-2 rounded-full bg-orange-500 mt-1 shrink-0"></span>
      <p>Configura tus rutas fácilmente agregando más ítems.</p>
    </div>
  </div>
</aside>
