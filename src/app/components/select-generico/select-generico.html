<div class="relative w-full">
  <select
    class="w-full appearance-none px-3 py-2 pr-10 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500 transition-colors disabled:opacity-60 disabled:cursor-not-allowed disabled:bg-slate-50 dark:disabled:bg-slate-900/50 truncate cursor-pointer"
    (change)="onSeleccion($event)"
    [disabled]="disabled">

    <!-- Es importante poner el fondo y color nativo en las opciones para Firefox/Windows -->
    <option 
      value="0" 
      disabled 
      selected 
      class="bg-white dark:bg-slate-800 text-slate-400 dark:text-slate-500">
      Seleccione una opción
    </option>

    @for (item of items; track item[valor]) {
      <option 
        [value]="item[valor]" 
        class="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200">
        {{ item[texto] }}
      </option>
    }

  </select>

  <!-- Flecha personalizada (Reactiva al modo oscuro y desactivado) -->
  <!-- pointer-events-none es clave para que los clicks pasen al select -->
  <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 dark:text-slate-500">
    <svg 
      class="w-5 h-5" 
      fill="none" 
      stroke="currentColor" 
      viewBox="0 0 24 24" 
      xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
    </svg>
  </div>
</div>
