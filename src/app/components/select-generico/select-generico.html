<select class="w-full px-3 py-2 border border-slate-300 rounded-lg" (change)="onSeleccion($event)" [disabled]="disabled">

  <option value="0" disabled selected>
    Seleccione una opción
  </option>

  @for (item of items; track item[valor]) {
    <option [value]="item[valor]">
      {{ item[texto] }}
    </option>
  }

</select>
