@if (isOpen()) {

  <!-- Fondo oscuro -->
  <div
    class="fixed inset-0 bg-black/50 z-40"
    (click)="cerrarModal()">
  </div>


  <!-- Modal -->
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">

    <div
      class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto"
      (click)="$event.stopPropagation()">


      <!-- Cabecera -->
      <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800">

        <h2 class="text-xl font-bold text-slate-800 dark:text-white">
          Editar excursión
        </h2>

        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
          Modifique los datos de la excursión
        </p>

      </div>


      <!-- Formulario -->
      <form
        [formGroup]="excursionForm"
        (ngSubmit)="submitForm()"
        class="p-6">


        <!-- Nombre -->
        <div class="mb-4">

          <label
            for="nombre"
            class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">
            Nombre
          </label>

          <input
            id="nombre"
            type="text"
            formControlName="nombre"
            class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-800 dark:text-white"
          >

          @if (
            excursionForm.get('nombre')?.touched &&
            excursionForm.get('nombre')?.invalid
          ) {

            <p class="text-red-500 text-xs mt-1">
              El nombre es obligatorio.
            </p>

          }

        </div>


        <!-- Fecha -->
        <div class="mb-4">

          <label
            for="fechaSalida"
            class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">
            Fecha de salida
          </label>

          <input
            id="fechaSalida"
            type="date"
            formControlName="fechaSalida"
            class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-800 dark:text-white"
          >

        </div>


        <!-- Días y lugares -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">

          <div>

            <label
              for="cantDias"
              class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">
              Cantidad de días
            </label>

            <input
              id="cantDias"
              type="number"
              min="1"
              formControlName="cantDias"
              class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-800 dark:text-white"
            >

          </div>


          <div>

            <label
              for="cantLugares"
              class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">
              Cantidad de lugares
            </label>

            <input
              id="cantLugares"
              type="number"
              min="1"
              formControlName="cantLugares"
              class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-800 dark:text-white"
            >

          </div>

        </div>


        <!-- Destino -->
        <div class="mb-6">

          <label
            for="destinoId"
            class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">
            Destino
          </label>

          <input
            id="destinoId"
            type="number"
            min="1"
            formControlName="destinoId"
            class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-800 dark:text-white"
          >

        </div>


        <!-- Botones -->
        <div class="flex justify-end gap-3">

          <button
            type="button"
            (click)="cerrarModal()"
            class="px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
            Cancelar
          </button>


          <button
            type="submit"
            class="px-4 py-2 rounded-lg bg-sky-500 hover:bg-sky-600 text-white font-semibold transition-colors">
            Guardar cambios
          </button>

        </div>

      </form>

    </div>

  </div>

}
