@if (mostrarModal) {

  <app-modal-generico
    titulo="Editar cliente"
    subtitulo="Modifique los datos del cliente"
    (cerrar)="cerrarModal()">

    <form
      [formGroup]="clienteForm"
      (ngSubmit)="submitForm()"
      class="space-y-4">


      <!-- Nombre -->
      <div>

        <label
          for="nombre"
          class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">
          Nombre
        </label>

        <input
          id="nombre"
          type="text"
          formControlName="nombre"
          class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg">

      </div>


      <!-- Apellido -->
      <div>

        <label
          for="apellido"
          class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">
          Apellido
        </label>

        <input
          id="apellido"
          type="text"
          formControlName="apellido"
          class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg">

      </div>


      <!-- CI -->
      <div>

        <label
          for="ci"
          class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">
          CI
        </label>

        <input
          id="ci"
          type="number"
          formControlName="ci"
          min="1"
          class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg">

      </div>


      <!-- Teléfono -->
      <div>

        <label
          for="telefono"
          class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">
          Teléfono
        </label>

        <input
          id="telefono"
          type="text"
          formControlName="telefono"
          class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg">

      </div>


      <!-- Fecha de nacimiento -->
      <div>

        <label
          for="fechaNacimiento"
          class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">
          Fecha de nacimiento
        </label>

        <input
          id="fechaNacimiento"
          type="date"
          formControlName="fechaNacimiento"
          class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg">

      </div>


      <!-- Botones -->
      <div class="flex justify-end gap-3 pt-4">

        <button
          type="button"
          (click)="cerrarModal()"
          class="px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
          Cancelar
        </button>

        <button
          type="submit"
          class="px-4 py-2 rounded-lg bg-sky-500 hover:bg-sky-600 text-white font-semibold">
          Guardar cambios
        </button>

      </div>

    </form>

  </app-modal-generico>

}
