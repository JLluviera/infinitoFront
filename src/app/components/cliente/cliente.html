<app-cliente-boton-agregar
  (clienteCreado)="cargarClientesInicial()">
</app-cliente-boton-agregar>
<div class="flex flex-col sm:flex-row gap-3 mb-5">

  <div class="relative flex-1">
    <input
      type="text"
      placeholder="Buscar por nombre, apellido o cédula..."
      [value]="filtroBusqueda()"
      (input)="filtroBusqueda.set($any($event.target).value)"
      (keyup.enter)="aplicarFiltro()"
      class="w-full px-4 py-3 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-800 dark:text-white focus:ring-2 focus:ring-sky-500 outline-none">
  </div>

  <button
    type="button"
    (click)="aplicarFiltro()"
    class="px-5 py-3 bg-sky-500 hover:bg-sky-600 text-white rounded-lg font-semibold">
    <i class="fas fa-search mr-2"></i>
    Filtrar
  </button>

  <button
    type="button"
    (click)="limpiarFiltro()"
    class="px-5 py-3 border border-slate-300 dark:border-slate-700 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
    Limpiar
  </button>

</div>

<app-lista-generica
  titulo="Listado de Clientes"
  subtitulo="Clientes registrados en la base de datos"
  [data]="clientes()"
  [columnas]="columnas"
  [rutaDetalle]="'/clientes/detalle'"
  [campoId]="'id'"
  [hasMore]="hayMas()"
  [loadingMore]="cargando()"
  (onEdit)="editarCliente($event)"
  (onDelete)="eliminarCliente($event.id)"
  (loadMore)="cargarClientes()"
>
</app-lista-generica>

@if (mostrarEdicion && clienteSeleccionado) {

  <app-cliente-boton-editar
    [cliente]="clienteSeleccionado"
    (clienteEditado)="finalizarEdicion()"
    (cerrar)="cerrarEdicion()">
  </app-cliente-boton-editar>

}
