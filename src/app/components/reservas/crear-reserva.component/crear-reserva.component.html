<div class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl w-full flex flex-col">

  <!-- Cabecera -->
  <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800">
    <h2 class="text-xl font-bold text-slate-800 dark:text-white">
      Nueva Reserva
    </h2>
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
      Complete los datos de la Reserva
    </p>
  </div>

  <!-- Formulario -->
  <form [formGroup]="reservaForm" (ngSubmit)="submitForm()" class="p-6 flex flex-col gap-5">

    <!-- IdExcursion -->
    <div class="flex flex-col gap-1.5">
      <label for="idExcursion" class="text-sm font-semibold text-slate-700 dark:text-slate-300">
        Excursión
      </label>
      <app-select-generico [items]="excursiones()" valor="id" texto="nombre"
        (seleccionCambiada)="cargarPaquetes($event)" [disabled]="!!idExcursion() || cargando()">
      </app-select-generico>
    </div>

    <!-- CiCliente -->
    <div class="flex flex-col gap-1.5">
      <label for="ciCliente" class="text-sm font-semibold text-slate-700 dark:text-slate-300">
        Cédula cliente pagador
      </label>
      <input id="ciCliente" type="number" formControlName="ciClientePagador" min="1" [readOnly]="cargando()"
        class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500 read-only:opacity-60 read-only:cursor-not-allowed">
    </div>

    <!-- Paquete -->
    <div class="flex flex-col gap-1.5">
      <label for="idPaquete" class="text-sm font-semibold text-slate-700 dark:text-slate-300">
        Paquete
      </label>
      <app-select-generico [items]="paquetes()" valor="id" texto="nombre" [disabled]="cargando()"
        (seleccionCambiada)="onSeleccionPaquete($event)">
      </app-select-generico>
    </div>

    <!-- Botones -->
    <div class="flex justify-end gap-3 mt-2">
      <button type="submit" [disabled]="reservaForm.invalid || cargando()"
        class="relative flex items-center justify-center min-w-[160px] px-4 py-2 rounded-lg bg-sky-500 hover:bg-sky-600 text-white font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2 dark:focus:ring-offset-slate-900 disabled:opacity-70 disabled:cursor-not-allowed disabled:hover:bg-sky-500">

        @if (cargando()) {
        <!-- Spinner SVG -->
        <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
        </svg>
        Guardando...
        } @else {
        Guardar Reserva
        }

      </button>
      <button type="button" (click)="volver()"
        class="px-4 py-2 rounded-lg bg-sky-500 hover:bg-sky-600 text-white font-semibold transition-colors">
        Volver
      </button>
    </div>

  </form>
</div>
