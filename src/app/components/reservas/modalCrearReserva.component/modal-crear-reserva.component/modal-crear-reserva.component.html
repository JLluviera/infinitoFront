<button
  type="button"
  (click)="abrirModal()"
  class="bg-sky-50 dark:bg-sky-500/10 text-sky-600 dark:text-sky-400 hover:bg-sky-500 dark:hover:bg-sky-500 hover:text-white dark:hover:text-white border border-sky-100 dark:border-sky-500/20 px-4 py-2 rounded-full text-sm font-bold transition-all shadow-2xs flex items-center gap-2 cursor-pointer">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    class="h-4 w-4"
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor"
    stroke-width="2">
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M12 4v16m8-8H4" />
  </svg>
  <span>Agregar Reserva</span>
</button>

@if (isOpen()) {
    <app-modal-generico
    titulo="Nueva Reserva"
    subtitulo="Complete todos los datos"
    (cerrar)="cerrarModal()">
        <app-crear-reserva
        [idExcursion]="idExcursion() ? idExcursion() : undefined">
        </app-crear-reserva>        

    </app-modal-generico>
}
