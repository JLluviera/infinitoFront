<div class="p-4">
  <button
    type="button"
    (click)="agregarReserva()"
    class="bg-sky-500 hover:bg-sky-600 text-white px-4 py-2 rounded-lg font-semibold transition-colors cursor-pointer">

    Agregar reserva

  </button>
</div>

<div class="max-w-4xl mx-auto space-y-6 mb-8">
  
  <!-- Contenedor Principal del Filtro -->
  <section aria-label="Filtros de búsqueda de reservas" class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6 md:p-8 transition-colors">
    
    <header class="flex items-center justify-between mb-5 pb-3 border-b border-slate-200/60 dark:border-slate-700/60">
      <h2 class="text-lg font-bold text-slate-800 dark:text-white flex items-center gap-2">
        <svg class="w-5 h-5 text-sky-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.25 21.75l4.14-1.24A8.963 8.963 0 0012 21c4.97 0 9-4.03 9-9s-4.03-9-9-9z"/>
        </svg>
        Filtrar Reservas
      </h2>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-5 items-end">
      
      <!-- Input para CI del Cliente -->
      <div class="md:col-span-5 flex flex-col gap-1.5">
        <label for="ciClienteInput" class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
          Cédula de Identidad (CI)
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5zm6-10.125a1.875 1.875 0 11-3.75 0 1.875 1.875 0 013.75 0z"/>
            </svg>
          </span>
          <input 
            id="ciClienteInput"
            type="number" 
            [value]="filtroCiCliente() ?? ''" 
            (input)="filtroCiCliente.set($any($event.target).value ? +$any($event.target).value : null)"
            placeholder="Ej: 45678912"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200/80 dark:border-slate-700/60 rounded-xl text-slate-800 dark:text-white placeholder-slate-400 text-sm focus:ring-2 focus:ring-sky-500/50 outline-none transition-colors"
          />
        </div>
      </div>

      <!-- Selector de Estado (Radio Select con diseño de pills/botones) -->
      <div class="md:col-span-7 flex flex-col gap-1.5">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
          Estado de Reserva
        </span>
        
        <div class="flex flex-wrap gap-2 items-center bg-slate-50 dark:bg-slate-800/50 p-1.5 border border-slate-200/80 dark:border-slate-700/60 rounded-xl">
          
          <!-- Opción: Todos / Sin Estado -->
          <button 
            type="button"
            (click)="filtroEstadoReserva.set(undefined)"
            [class]="filtroEstadoReserva() === undefined 
              ? 'bg-sky-500 text-white font-bold shadow-2xs' 
              : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-700/60 font-medium'"
            class="px-3.5 py-1.5 text-xs rounded-lg transition-all cursor-pointer outline-none">
            Todos
          </button>

          <!-- Opción: Confirmada -->
          <button 
            type="button"
            (click)="filtroEstadoReserva.set(EstadoReserva.Confirmada)"
            [class]="filtroEstadoReserva() === EstadoReserva.Confirmada 
              ? 'bg-emerald-500 text-white font-bold shadow-2xs' 
              : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-700/60 font-medium'"
            class="px-3.5 py-1.5 text-xs rounded-lg transition-all cursor-pointer outline-none">
            Confirmada
          </button>

          <!-- Opción: Pendiente -->
          <button 
            type="button"
            (click)="filtroEstadoReserva.set(EstadoReserva.Pendiente)"
            [class]="filtroEstadoReserva() === EstadoReserva.Pendiente 
              ? 'bg-amber-500 text-white font-bold shadow-2xs' 
              : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-700/60 font-medium'"
            class="px-3.5 py-1.5 text-xs rounded-lg transition-all cursor-pointer outline-none">
            Pendiente
          </button>

          <!-- Opción: Anulada -->
          <button 
            type="button"
            (click)="filtroEstadoReserva.set(EstadoReserva.Anulada)"
            [class]="filtroEstadoReserva() === EstadoReserva.Anulada 
              ? 'bg-rose-500 text-white font-bold shadow-2xs' 
              : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-700/60 font-medium'"
            class="px-3.5 py-1.5 text-xs rounded-lg transition-all cursor-pointer outline-none">
            Anulada
          </button>

          <!-- Opción: Cancelada -->
          <button 
            type="button"
            (click)="filtroEstadoReserva.set(EstadoReserva.Cancelada)"
            [class]="filtroEstadoReserva() === EstadoReserva.Cancelada 
              ? 'bg-red-600 text-white font-bold shadow-2xs' 
              : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-700/60 font-medium'"
            class="px-3.5 py-1.5 text-xs rounded-lg transition-all cursor-pointer outline-none">
            Cancelada
          </button>

          <!-- Si tuvieras más estados en tu enum, puedes agregarlos siguiendo la misma estructura -->

        </div>
      </div>

    </div>

    <!-- Botones de Acción (Aplicar / Borrar Filtros) -->
    <div class="mt-6 pt-4 border-t border-slate-200/60 dark:border-slate-700/60 flex flex-wrap gap-3 justify-end items-center">
      
      <!-- Botón Borrar Filtros -->
      <button 
        (click)="borrarFiltros()" 
        type="button" 
        aria-label="Borrar filtros de búsqueda"
        class="w-full sm:w-auto px-5 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold text-sm rounded-full shadow-2xs transition-all cursor-pointer flex items-center justify-center gap-2 focus:ring-2 focus:ring-slate-500/50 outline-none">
        <svg class="w-4 h-4 text-slate-500 dark:text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
        <span>Limpiar filtros</span>
      </button>

      <!-- Botón Aplicar Filtros -->
      <button 
        (click)="aplicarFiltros()" 
        type="button" 
        aria-label="Aplicar filtros de búsqueda"
        class="w-full sm:w-auto px-6 py-2.5 bg-sky-500 hover:bg-sky-600 active:bg-sky-700 text-white font-bold text-sm rounded-full shadow-2xs transition-all cursor-pointer flex items-center justify-center gap-2 focus:ring-2 focus:ring-sky-500/50 outline-none">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
        </svg>
        <span>Aplicar filtros</span>
      </button>

    </div>

  </section>

</div>

<app-lista-generica
  titulo="Listado de Reservas"
  subtitulo="Reservas registradas en la base de datos"
  [data]="reservas()"
  [columnas]="columnas"

  [mostrarDetalle]="true"
  [mostrarEditar]="false"
  [mostrarEliminar]="false"

  [hasMore]="hayMas()"
  [loadingMore]="cargando()"
  [mostrarEliminar]="false"
  [rutaDetalle]="'/reserva/detalle'"
  [campoId]="'id'"
  [columnas]="columnas"
  (onEdit)="verReserva($event)"
  (loadMore)="cargarReservas()"

  (onDetail)="verReserva($event)"
>
</app-lista-generica>
