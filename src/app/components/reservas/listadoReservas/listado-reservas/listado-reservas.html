<div class="p-4">
  <button
    type="button"
    (click)="agregarReserva()"
    class="bg-sky-500 hover:bg-sky-600 text-white px-4 py-2 rounded-lg font-semibold transition-colors cursor-pointer">

    Agregar reserva

  </button>
</div>
<app-lista-generica
  titulo="Listado de Reservas"
  subtitulo="Reservas registradas en la base de datos"
  [data]="reservas()"
  [columnas]="columnas"

  [mostrarDetalle]="true"
  [mostrarEditar]="false"
  [mostrarEliminar]="false"

  [hasMore]="hayMas()"
  [loadingMore]="cargando()"
  [mostrarEliminar]="false"
  [rutaDetalle]="'/reserva/detalle'"
  [campoId]="'id'"
  [columnas]="columnas"
  (onEdit)="verReserva($event)"
  (loadMore)="cargarReservas()"

  (onDetail)="verReserva($event)"
>
</app-lista-generica>
