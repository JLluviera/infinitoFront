<button
  type="button"
  (click)="agregarReserva()"
  class="px-4 py-2 rounded-lg bg-sky-500 hover:bg-sky-600 text-white font-semibold transition-colors"
>
  Agregar reserva
</button>
<app-lista-generica
  titulo="Listado de Reservas"
  subtitulo="Reservas registradas en la base de datos"
  [data]="reservas()"
  [columnas]="columnas"
  [hasMore]="hayMas()"
  [loadingMore]="cargando()"
  (loadMore)="cargarReservas()"
>
</app-lista-generica>
