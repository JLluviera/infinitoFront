<button
  type="button"
  (click)="agregarReserva()"
  class="px-4 py-2 rounded-lg bg-sky-500 hover:bg-sky-600 text-white font-semibold transition-colors"
>
  Agregar reserva
</button>
<app-lista-generica 
    titulo="Listado de Reservas"
    subtitulo="Reservas disponibles en la base de datos"
    [data]="reservas()"
    [rutaDetalle]="'/reserva/detalle'"
    [campoId]="'id'"
    [columnas]="columnas"
    (onEdit)="verReserva($event.id)"
></app-lista-generica>
