<app-modal-generico
  titulo="Editar Transacción"
  subtitulo="Modifique los datos de la transacción"
  (cerrar)="cerrarModal()"
>

  <form
    [formGroup]="transaccionForm"
    (ngSubmit)="guardar()"
  >

    <!-- Monto -->
    <div class="mb-4">

      <label
        for="monto"
        class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1"
      >
        Monto
      </label>

      <input
        id="monto"
        type="number"
        min="1"
        formControlName="monto"
        class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-800 dark:text-white"
      >

    </div>


    <!-- Fecha -->
    <div class="mb-4">

      <label
        for="fechaCreacion"
        class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1"
      >
        Fecha
      </label>

      <input
        id="fechaCreacion"
        type="date"
        formControlName="fechaCreacion"
        class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-800 dark:text-white"
      >

    </div>


    <!-- Forma de pago -->
    <div class="mb-4">

      <label
        for="formaDePago"
        class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1"
      >
        Forma de pago
      </label>

      <select
        id="formaDePago"
        formControlName="formaDePago"
        class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800"
      >

        <option [ngValue]="FormaDePago.Efectivo">
          Efectivo
        </option>

        <option [ngValue]="FormaDePago.TarjetaDebito">
          Tarjeta de débito
        </option>

        <option [ngValue]="FormaDePago.TarjetaCredito">
          Tarjeta de crédito
        </option>

        <option [ngValue]="FormaDePago.Transferencia">
          Transferencia
        </option>

      </select>

    </div>


    <!-- Estado -->
    <div class="mb-4">

      <label
        for="estado"
        class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1"
      >
        Estado
      </label>

      <select
        id="estado"
        formControlName="estado"
        class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800"
      >

        <option [ngValue]="EstadoTransaccion.Pendiente">
          Pendiente
        </option>

        <option [ngValue]="EstadoTransaccion.Finalizado">
          Finalizado
        </option>

      </select>

    </div>


    <!-- ID Reserva -->
    <div class="mb-4">

      <label
        for="idReserva"
        class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1"
      >
        ID Reserva
      </label>

      <input
        id="idReserva"
        type="number"
        min="1"
        formControlName="idReserva"
        class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800"
      >

    </div>


    <!-- ID Cliente -->
    <div class="mb-4">

      <label
        for="idCliente"
        class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1"
      >
        ID Cliente
      </label>

      <input
        id="idCliente"
        type="number"
        min="1"
        formControlName="idCliente"
        class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800"
      >

    </div>


    <!-- Observaciones -->
    <div class="mb-6">

      <label
        for="observaciones"
        class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1"
      >
        Observaciones
      </label>

      <textarea
        id="observaciones"
        rows="3"
        formControlName="observaciones"
        class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800"
      ></textarea>

    </div>


    <!-- Botones -->
    <div class="flex justify-end gap-3">

      <button
        type="button"
        (click)="cerrarModal()"
        class="px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300"
      >
        Cancelar
      </button>

      <button
        type="submit"
        class="px-4 py-2 rounded-lg bg-sky-500 hover:bg-sky-600 text-white font-semibold"
      >
        Guardar cambios
      </button>

    </div>

  </form>

</app-modal-generico>
