<!-- Fondo oscuro -->
<div
  class="fixed inset-0 bg-black/50 z-40"
  (click)="cerrarModal()">
</div>


<!-- Contenedor del modal -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4">

  <div
    class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto"
    (click)="$event.stopPropagation()">


    <!-- Cabecera -->
    <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800">

      <h2 class="text-xl font-bold text-slate-800 dark:text-white">
        {{ titulo }}
      </h2>

      @if (subtitulo) {
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
          {{ subtitulo }}
        </p>
      }

    </div>


    <!-- Contenido que le pase el componente padre -->
    <div class="p-6">

      <ng-content></ng-content>

    </div>


  </div>

</div>
<div>
    <h2 class="text-xl font-bold text-slate-800 dark:text-white">
      {{ titulo }}
    </h2>

    @if (subtitulo) {
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
        {{ subtitulo }}
      </p>
    }
  </div>
<div>
  <button
    type="button"
    (click)="cerrarModal()"
    class="w-8 h-8 flex items-center justify-center rounded-full text-slate-400 hover:text-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 dark:hover:text-slate-200 transition-colors cursor-pointer">

    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-5 h-5"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2">

      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M6 18L18 6M6 6l12 12" />

    </svg>

  </button>

</div>
