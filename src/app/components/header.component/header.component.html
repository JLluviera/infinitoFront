<header class="bg-white dark:bg-slate-900 border-b border-gray-100 dark:border-slate-800 shadow-sm z-10 relative transition-colors duration-300">
  <div class="container mx-auto px-4 h-16 flex items-center justify-between">
    
    <!-- Logo / Marca -->
    <div class="flex items-center gap-3 cursor-pointer">
      <img src="images/images.png" alt="Logo" class="h-8 w-auto">
      <span class="text-xl font-extrabold text-slate-800 dark:text-white tracking-tight transition-colors">
        Infinito <span class="text-sky-500 dark:text-sky-400">Viajes</span>
      </span>
    </div>

    <!-- Contenedor Derecho: Saludo + Botón de Salir + Menú Hamburguesa -->
    <div class="flex items-center gap-3">
      
      <!-- Contenedor de Usuario y Logout -->
      <div class="flex items-center gap-3 bg-slate-50 dark:bg-slate-800/60 border border-slate-200/60 dark:border-slate-700/60 pl-3 pr-2 py-1.5 rounded-full shadow-2xs transition-colors">
        
        <!-- Saludo con el usuario decodificado -->
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-full bg-sky-500/10 dark:bg-sky-500/20 text-sky-600 dark:text-sky-400 flex items-center justify-center font-bold text-xs">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </div>
          <span class="text-xs sm:text-sm font-medium text-slate-700 dark:text-slate-200 hidden sm:inline">
            Hola, <strong class="font-semibold text-slate-900 dark:text-white">{{ this.username || 'Usuario' }}</strong>
          </span>
        </div>

        <!-- Línea separadora sutil -->
        <div class="h-4 w-px bg-slate-200 dark:bg-slate-700"></div>

        <!-- Botón Cerrar Sesión -->
        <button 
          class="bg-rose-50 dark:bg-rose-500/10 text-rose-600 dark:text-rose-400 hover:bg-rose-500 dark:hover:bg-rose-500 hover:text-white dark:hover:text-white border border-rose-100 dark:border-rose-500/20 px-3.5 py-1.5 rounded-full text-xs font-bold transition-all shadow-2xs flex items-center gap-1.5 cursor-pointer" 
          (click)="onLogOut()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          <span>Salir</span>
        </button>

      </div>

      <!-- Botón de Sidebar (Móvil) -->
      <button 
        class="md:hidden p-2 text-slate-500 dark:text-slate-400 hover:text-orange-500 dark:hover:text-orange-400 focus:outline-none transition-colors rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800"
        (click)="onToggleSidebar()"
        aria-label="Alternar menú lateral"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      
    </div>
    
  </div>
</header>
