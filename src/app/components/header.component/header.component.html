<header class="bg-white border-b-2 border-blue-600 shadow-sm transition-all z-10 relative">
  <div class="container mx-auto px-4 h-16 flex items-center justify-between">
    
    <!-- Logo / Marca -->
    <div class="flex items-center gap-2 cursor-pointer">
      <img src="images/images.png" alt="Logo" class="h-10 w-auto">
      <span class="text-2xl font-bold text-blue-600">Infinito Viajes</span>
      
    </div>

    <!-- Navegación de Escritorio (Oculta en móviles) -->
    <nav class="hidden md:flex items-center gap-6">      
      <!-- Botón principal en azul -->
      <button class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-md font-medium transition-colors">
        Ingresar
      </button>
    </nav>

    <!-- Botón de Sidebar (Visible solo en móviles y tablets pequeñas) -->
    <button 
      class="md:hidden p-2 text-blue-600 hover:text-orange-500 focus:outline-none transition-colors rounded-md hover:bg-blue-50"
      (click)="onToggleSidebar()"
      aria-label="Alternar menú lateral"
    >
      <!-- Ícono de Hamburguesa en SVG -->
      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    
  </div>
</header>
