<!-- Botón para abrir -->
<button
  type="button"
  (click)="abrirModal()"
  class="bg-sky-50 dark:bg-sky-500/10 text-sky-600 dark:text-sky-400 hover:bg-sky-500 dark:hover:bg-sky-500 hover:text-white dark:hover:text-white border border-sky-100 dark:border-sky-500/20 px-4 py-2 rounded-full text-sm font-bold transition-all shadow-2xs flex items-center gap-2 cursor-pointer">

  <svg
    xmlns="http://www.w3.org/2000/svg"
    class="h-4 w-4"
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor"
    stroke-width="2">

    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M12 4v16m8-8H4" />

  </svg>

  <span>Agregar País</span>

</button>


<!-- Modal genérico -->
@if (isOpen()) {

  <app-modal-generico
    titulo="Nuevo País"
    subtitulo="Complete los datos del país"
    (cerrar)="cerrarModal()">

    <!-- Formulario de País -->
    <form
      [formGroup]="paisForm"
      (ngSubmit)="submitForm()"
      class="space-y-5">

      <!-- Nombre -->
      <div>

        <label
          for="nombre"
          class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">

          Nombre del País

        </label>

        <input
          id="nombre"
          type="text"
          formControlName="nombre"
          placeholder="Ej. Uruguay"
          class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-lg px-4 py-2.5 text-slate-900 dark:text-white">

        @if (
          paisForm.get('nombre')?.invalid &&
          paisForm.get('nombre')?.touched
        ) {

          <span class="text-xs text-rose-500 mt-1.5 block">
            El nombre es requerido.
          </span>

        }

      </div>


      <!-- Código -->
      <div>

        <label
          for="codigo"
          class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">

          Código del País

        </label>

        <input
          id="codigo"
          type="text"
          formControlName="codigo"
          placeholder="Ej. UY, ARG, ESP"
          class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-lg px-4 py-2.5 text-slate-900 dark:text-white uppercase">

        @if (
          paisForm.get('codigo')?.invalid &&
          paisForm.get('codigo')?.touched
        ) {

          <span class="text-xs text-rose-500 mt-1.5 block">
            Ingrese un código válido.
          </span>

        }

      </div>


      <!-- Botones -->
      <div class="flex justify-end gap-3 pt-4">

        <button
          type="button"
          (click)="cerrarModal()"
          class="px-4 py-2 rounded-full text-sm font-bold text-slate-600 dark:text-slate-300 bg-slate-200/50 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">

          Cancelar

        </button>

        <button
          type="submit"
          [disabled]="paisForm.invalid"
          class="px-5 py-2 rounded-full text-sm font-bold text-white bg-sky-500 hover:bg-sky-600 dark:bg-sky-500 dark:hover:bg-sky-400 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">

          Guardar País

        </button>

      </div>

    </form>

  </app-modal-generico>

}
