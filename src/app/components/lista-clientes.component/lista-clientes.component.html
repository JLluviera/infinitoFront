
    <!-- Contenedor principal con soporte para modo claro y oscuro -->
    <div class="max-w-4xl mx-auto p-6 transition-colors duration-300">
      
      <!-- Título de la sección -->
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-extrabold text-slate-800 dark:text-white tracking-tight">
          Listado de <span class="text-sky-500 dark:text-sky-400">Clientes</span>
        </h2>
        <span class="text-xs font-semibold px-3 py-1 rounded-full bg-sky-50 dark:bg-sky-500/10 text-sky-600 dark:text-sky-400 border border-sky-100 dark:border-sky-500/20">
          Total: {{ clientes.length }}
        </span>
      </div>

      <!-- Lista de clientes -->
      <div class="bg-white dark:bg-slate-900 border border-gray-100 dark:border-slate-800 rounded-2xl shadow-sm overflow-hidden transition-colors">
        <ul class="divide-y divide-gray-100 dark:divide-slate-800">
          
          <!-- @for recorre de forma optimizada la lista que trae la API -->
          @for (cliente of clientes; track cliente.id) {
            <li class="p-4 hover:bg-sky-50/50 dark:hover:bg-slate-800/50 transition-colors flex items-center justify-between">
              <div class="flex items-center gap-3">
                <!-- Avatar simulado con las iniciales o un ícono -->
                <div class="w-10 h-10 rounded-full bg-sky-100 dark:bg-sky-500/20 text-sky-600 dark:text-sky-400 font-bold flex items-center justify-center text-sm">
                  {{ cliente.nombre.charAt(0) }}
                </div>
                <div>
                  <p class="font-medium text-slate-800 dark:text-slate-200">{{ cliente.nombre }}</p>
                  <p class="text-sm text-slate-400 dark:text-slate-500">{{ cliente.email }}</p>
                </div>
              </div>
              
              <!-- Badge de estado o ID -->
              <span class="text-xs text-slate-400 dark:text-slate-500 bg-slate-50 dark:bg-slate-800 px-2.5 py-1 rounded-lg border border-gray-100 dark:border-slate-700">
                ID: #{{ cliente.id }}
              </span>
            </li>
          } @empty {
            <!-- Se muestra esto automáticamente si la lista llega vacía o está cargando -->
            <div class="p-8 text-center text-slate-400 dark:text-slate-500">
              <p>No hay clientes registrados o cargando datos...</p>
            </div>
          }

        </ul>
      </div>

    </div>
